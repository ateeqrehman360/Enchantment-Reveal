plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mods {
        enchantment_reveal {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation fabricApi.module('fabric-networking-api-v1', project.fabric_api_version)
}

processResources {
    def version = project.version

    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

jar {
    def projectName = project.name

    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_${projectName}" }
    }
}

sourceSets {
    verification {
        compileClasspath += sourceSets.main.runtimeClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.register('verifyOfferPreview', JavaExec) {
    dependsOn tasks.named('verificationClasses')
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'net.crownsheep.enchantment_reveal.OfferPreviewCheck'
    doFirst {
        workingDir = temporaryDir
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyOfferPreview')
}
